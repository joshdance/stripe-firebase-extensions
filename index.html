<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gem Dropping Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        #info h1 {
            font-size: 24px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #info p {
            font-size: 16px;
            opacity: 0.9;
        }
        .key {
            display: inline-block;
            padding: 5px 12px;
            margin: 0 5px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            font-weight: bold;
        }
        .key.red { color: #ff6b6b; border: 1px solid #ff6b6b; }
        .key.green { color: #4ecdc4; border: 1px solid #4ecdc4; }
        .key.purple { color: #a855f7; border: 1px solid #a855f7; }
        #gem-count {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>✨ Gem Dropping Game ✨</h1>
        <p>
            Press <span class="key red">A</span> for Red gems
            <span class="key green">B</span> for Green gems
            <span class="key purple">C</span> for Purple gems
        </p>
    </div>
    <div id="gem-count">Gems: <span id="count">0</span></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // Audio Context for sound effects
        let audioContext = null;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTinkleSound(intensity = 1) {
            if (!audioContext) return;

            const now = audioContext.currentTime;

            // Create a crystalline tinkle sound
            const oscillator1 = audioContext.createOscillator();
            const oscillator2 = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();

            // Random high frequencies for crystal-like sound
            const baseFreq = 800 + Math.random() * 2000;
            oscillator1.frequency.setValueAtTime(baseFreq, now);
            oscillator1.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, now + 0.3);
            oscillator1.type = 'sine';

            oscillator2.frequency.setValueAtTime(baseFreq * 1.5, now);
            oscillator2.frequency.exponentialRampToValueAtTime(baseFreq * 0.75, now + 0.25);
            oscillator2.type = 'triangle';

            // High-pass filter for sparkle
            filter.type = 'highpass';
            filter.frequency.setValueAtTime(1000, now);

            // Volume envelope - quick attack, medium decay
            const volume = Math.min(0.15 * intensity, 0.3);
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(volume, now + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

            // Connect nodes
            oscillator1.connect(filter);
            oscillator2.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioContext.destination);

            // Play
            oscillator1.start(now);
            oscillator2.start(now);
            oscillator1.stop(now + 0.3);
            oscillator2.stop(now + 0.3);
        }

        // Simple physics engine
        class PhysicsWorld {
            constructor() {
                this.bodies = [];
                this.gravity = new THREE.Vector3(0, -20, 0);
                this.groundY = -5;
                this.restitution = 0.4;
                this.friction = 0.3;
            }

            addBody(body) {
                this.bodies.push(body);
            }

            update(deltaTime) {
                const dt = Math.min(deltaTime, 0.02);

                for (const body of this.bodies) {
                    if (body.isStatic) continue;

                    // Apply gravity
                    body.velocity.addScaledVector(this.gravity, dt);

                    // Apply damping
                    body.velocity.multiplyScalar(0.995);
                    body.angularVelocity.multiplyScalar(0.98);

                    // Update position
                    body.position.addScaledVector(body.velocity, dt);

                    // Update rotation
                    const rotationSpeed = body.angularVelocity.length() * dt;
                    if (rotationSpeed > 0.001) {
                        const axis = body.angularVelocity.clone().normalize();
                        body.quaternion.multiply(
                            new THREE.Quaternion().setFromAxisAngle(axis, rotationSpeed)
                        );
                    }

                    // Ground collision
                    const groundLevel = this.groundY + body.radius;
                    if (body.position.y < groundLevel) {
                        const impactVelocity = Math.abs(body.velocity.y);
                        body.position.y = groundLevel;

                        if (impactVelocity > 0.5) {
                            playTinkleSound(Math.min(impactVelocity / 10, 1));
                        }

                        body.velocity.y = -body.velocity.y * this.restitution;
                        body.velocity.x *= (1 - this.friction);
                        body.velocity.z *= (1 - this.friction);

                        // Add some angular velocity on bounce
                        body.angularVelocity.x += body.velocity.z * 2;
                        body.angularVelocity.z -= body.velocity.x * 2;
                    }

                    // Wall collisions
                    const wallLimit = 8;
                    if (Math.abs(body.position.x) > wallLimit - body.radius) {
                        body.position.x = Math.sign(body.position.x) * (wallLimit - body.radius);
                        const impactVelocity = Math.abs(body.velocity.x);
                        if (impactVelocity > 1) {
                            playTinkleSound(Math.min(impactVelocity / 15, 0.5));
                        }
                        body.velocity.x = -body.velocity.x * this.restitution;
                    }

                    if (Math.abs(body.position.z) > wallLimit - body.radius) {
                        body.position.z = Math.sign(body.position.z) * (wallLimit - body.radius);
                        const impactVelocity = Math.abs(body.velocity.z);
                        if (impactVelocity > 1) {
                            playTinkleSound(Math.min(impactVelocity / 15, 0.5));
                        }
                        body.velocity.z = -body.velocity.z * this.restitution;
                    }

                    // Gem-to-gem collisions
                    for (const other of this.bodies) {
                        if (other === body || other.isStatic) continue;

                        const diff = new THREE.Vector3().subVectors(body.position, other.position);
                        const distance = diff.length();
                        const minDist = body.radius + other.radius;

                        if (distance < minDist && distance > 0.001) {
                            // Collision detected
                            const normal = diff.normalize();
                            const overlap = minDist - distance;

                            // Separate bodies
                            body.position.addScaledVector(normal, overlap * 0.5);
                            other.position.addScaledVector(normal, -overlap * 0.5);

                            // Calculate relative velocity
                            const relativeVel = new THREE.Vector3().subVectors(body.velocity, other.velocity);
                            const velAlongNormal = relativeVel.dot(normal);

                            // Only resolve if velocities are separating
                            if (velAlongNormal < 0) {
                                const impactSpeed = Math.abs(velAlongNormal);

                                if (impactSpeed > 0.5) {
                                    playTinkleSound(Math.min(impactSpeed / 8, 0.7));
                                }

                                // Apply impulse
                                const impulse = normal.multiplyScalar(velAlongNormal * -(1 + this.restitution) * 0.5);
                                body.velocity.add(impulse);
                                other.velocity.sub(impulse);

                                // Add angular velocity from collision
                                body.angularVelocity.add(new THREE.Vector3(
                                    (Math.random() - 0.5) * impactSpeed,
                                    (Math.random() - 0.5) * impactSpeed,
                                    (Math.random() - 0.5) * impactSpeed
                                ));
                            }
                        }
                    }
                }
            }
        }

        class PhysicsBody {
            constructor(position, radius = 0.5) {
                this.position = position.clone();
                this.velocity = new THREE.Vector3(0, 0, 0);
                this.angularVelocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 5,
                    (Math.random() - 0.5) * 5,
                    (Math.random() - 0.5) * 5
                );
                this.quaternion = new THREE.Quaternion();
                this.radius = radius;
                this.isStatic = false;
            }
        }

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 15, 40);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 8, 18);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Physics
        const physicsWorld = new PhysicsWorld();

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 50;
        mainLight.shadow.camera.left = -15;
        mainLight.shadow.camera.right = 15;
        mainLight.shadow.camera.top = 15;
        mainLight.shadow.camera.bottom = -15;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x6060ff, 0.3);
        fillLight.position.set(-10, 10, -10);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xff6060, 0.2);
        rimLight.position.set(0, -5, 15);
        scene.add(rimLight);

        // Ground
        const groundGeometry = new THREE.BoxGeometry(20, 1, 20);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2a4a,
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.position.y = -5.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // Invisible walls for visual
        const wallMaterial = new THREE.MeshStandardMaterial({
            color: 0x3a3a5a,
            roughness: 0.5,
            metalness: 0.3,
            transparent: true,
            opacity: 0.3
        });

        // Back wall
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(20, 15, 0.5), wallMaterial);
        backWall.position.set(0, 2, -8);
        scene.add(backWall);

        // Side walls
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 15, 16), wallMaterial);
        leftWall.position.set(-8, 2, 0);
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 15, 16), wallMaterial);
        rightWall.position.set(8, 2, 0);
        scene.add(rightWall);

        // Gem creation
        const gems = [];
        let gemCount = 0;

        function createGemGeometry() {
            // Create an octahedron (diamond-like shape)
            const geometry = new THREE.OctahedronGeometry(0.5, 0);
            return geometry;
        }

        function createGemMaterial(color) {
            return new THREE.MeshPhysicalMaterial({
                color: color,
                metalness: 0.1,
                roughness: 0.1,
                transmission: 0.5,
                thickness: 0.5,
                clearcoat: 1,
                clearcoatRoughness: 0.1,
                emissive: color,
                emissiveIntensity: 0.1
            });
        }

        const gemColors = {
            'a': 0xff6b6b, // Red
            'b': 0x4ecdc4, // Green/Teal
            'c': 0xa855f7  // Purple
        };

        function spawnGem(key) {
            initAudio();

            const color = gemColors[key];
            if (!color) return;

            const geometry = createGemGeometry();
            const material = createGemMaterial(color);
            const mesh = new THREE.Mesh(geometry, material);

            // Random spawn position at top
            const spawnX = (Math.random() - 0.5) * 10;
            const spawnZ = (Math.random() - 0.5) * 10;
            const spawnY = 12 + Math.random() * 3;

            mesh.position.set(spawnX, spawnY, spawnZ);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            // Random initial rotation
            mesh.rotation.set(
                Math.random() * Math.PI * 2,
                Math.random() * Math.PI * 2,
                Math.random() * Math.PI * 2
            );

            scene.add(mesh);

            // Create physics body
            const body = new PhysicsBody(mesh.position, 0.5);
            body.velocity.set(
                (Math.random() - 0.5) * 2,
                -2,
                (Math.random() - 0.5) * 2
            );
            physicsWorld.addBody(body);

            gems.push({ mesh, body });
            gemCount++;
            document.getElementById('count').textContent = gemCount;

            // Add a subtle glow effect
            const glowGeometry = new THREE.OctahedronGeometry(0.6, 0);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.2,
                side: THREE.BackSide
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            mesh.add(glow);
        }

        // Keyboard input
        document.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            if (key === 'a' || key === 'b' || key === 'c') {
                spawnGem(key);
            }
        });

        // Click/touch to enable audio on mobile
        document.addEventListener('click', initAudio);
        document.addEventListener('touchstart', initAudio);

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const currentTime = performance.now();
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            // Update physics
            physicsWorld.update(deltaTime);

            // Sync meshes with physics bodies
            for (const gem of gems) {
                gem.mesh.position.copy(gem.body.position);
                gem.mesh.quaternion.copy(gem.body.quaternion);
            }

            // Subtle camera movement
            const time = currentTime / 1000;
            camera.position.x = Math.sin(time * 0.1) * 2;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        animate();

        console.log('🎮 Gem Dropping Game loaded!');
        console.log('Press A for red gems, B for green gems, C for purple gems');
    </script>
</body>
</html>
